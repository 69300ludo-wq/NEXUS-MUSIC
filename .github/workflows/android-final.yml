name: NEXUS MUSIC Final

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build NEXUS MUSIC 1.0.1 release
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='com.nexusmusic.player'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk NEXUS-MUSIC-v1.0.1-FINAL.apk
          sha256sum NEXUS-MUSIC-v1.0.1-FINAL.apk > NEXUS-MUSIC-v1.0.1-FINAL.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-MUSIC-v1.0.1-FINAL
          path: |
            NEXUS-MUSIC-v1.0.1-FINAL.apk
            NEXUS-MUSIC-v1.0.1-FINAL.sha256
