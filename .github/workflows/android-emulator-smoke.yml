name: Android Emulator Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/emulator_smoke.py'
      - 'tools/radio_api_smoke.py'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check Radio Browser directory
        continue-on-error: true
        run: python3 tools/radio_api_smoke.py

      - name: Boot Android and test NEXUS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/emulator_smoke.py

      - name: Save audio test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-audio-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Save emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-emulator-smoke
          path: test-results/
          if-no-files-found: ignore
